# Produção: Cloudflare (proxy laranja) → VPS → Traefik → containers.
# Sem ports no host. Sem Postgres local. TLS na origem = Origin CA no Traefik da OS
# (não Let's Encrypt / HTTP-01 — conflita com o proxy da Cloudflare).
#
# SSR: NUXT_API_BASE usa container_name único (não o service name `backend`).

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: gutierresconsultoria-api:prod
    container_name: gutierresconsultoria-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-properties}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-}
      ADMIN_REQUIRE_ROLE: ${ADMIN_REQUIRE_ROLE:-false}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-web}
      - traefik.http.routers.gutierresconsultoria-api.rule=Host(`${API_DOMAIN}`)
      - traefik.http.routers.gutierresconsultoria-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gutierresconsultoria-api.tls=true
      - traefik.http.services.gutierresconsultoria-api.loadbalancer.server.port=3001

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
        NUXT_PUBLIC_SITE_NAME: ${NUXT_PUBLIC_SITE_NAME:-Gutierres Consultoria}
        NUXT_PUBLIC_NO_INDEX: ${NUXT_PUBLIC_NO_INDEX:-false}
        NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL:-}
        NUXT_PUBLIC_SUPABASE_ANON_KEY: ${NUXT_PUBLIC_SUPABASE_ANON_KEY:-}
    image: gutierresconsultoria-web:prod
    container_name: gutierresconsultoria-web
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
      NUXT_API_BASE: http://gutierresconsultoria-backend:3001
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
      NUXT_PUBLIC_SITE_NAME: ${NUXT_PUBLIC_SITE_NAME:-Gutierres Consultoria}
      NUXT_PUBLIC_NO_INDEX: ${NUXT_PUBLIC_NO_INDEX:-false}
      NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL:-}
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${NUXT_PUBLIC_SUPABASE_ANON_KEY:-}
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-web}
      - traefik.http.middlewares.gutierresconsultoria-www.redirectregex.regex=^https://www\.(.+)
      - traefik.http.middlewares.gutierresconsultoria-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.gutierresconsultoria-www.redirectregex.permanent=true
      - traefik.http.routers.gutierresconsultoria-web.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)
      - traefik.http.routers.gutierresconsultoria-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gutierresconsultoria-web.tls=true
      - traefik.http.routers.gutierresconsultoria-web.middlewares=gutierresconsultoria-www
      - traefik.http.services.gutierresconsultoria-web.loadbalancer.server.port=3000

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-web}
    external: true
